<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Professional Task Center v2.6 (Filtered View)</title>
    <style>
        :root { --toss-blue: #3182f6; --toss-red: #f04452; --toss-yellow: #ffb300; --toss-green: #2d7a2d; }
        body { margin: 0; padding: 15px; font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #f2f4f6; color: #191f28; overflow: hidden; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 20px; display: flex; flex-direction: column; height: calc(100vh - 30px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        
        /* 헤더 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #f2f4f6; shrink: 0; }
        .nav-group { display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-btn { background: none; border: none; padding: 8px; cursor: pointer; font-size: 18px; border-radius: 50%; color: #4e5968; }
        .current-month { font-size: 20px; font-weight: bold; cursor: pointer; padding: 4px 12px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
        .jump-box { display: none; position: absolute; top: 40px; left: 50%; transform: translateX(-50%); background: white; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 3000; padding: 15px; border: 1px solid #eee; width: 260px; }
        .jump-grid { display: grid; grid-template-cols: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .jump-item { padding: 6px; border: 1px solid #eee; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; }
        .jump-item.active { background: #e8f3ff; color: var(--toss-blue); font-weight: bold; border-color: var(--toss-blue); }
        .btn-main { background: var(--toss-blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        
        /* 캘린더 */
        .calendar-section { flex: 0 0 auto; }
        .day-labels { display: grid; grid-template-columns: repeat(7, 1fr); background: #fafafa; border-bottom: 1px solid #eee; }
        .day-labels div { padding: 6px 0; text-align: center; font-weight: bold; font-size: 12px; color: #8b95a1; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(40px, auto); }
        .cell { border-right: 1px solid #eee; border-bottom: 1px solid #eee; padding: 4px; box-sizing: border-box; transition: background 0.2s; position: relative; }
        .cell.drag-over { background-color: #f1f7ff; box-shadow: inset 0 0 0 2px var(--toss-blue); }
        .date-num { font-weight: bold; font-size: 12px; margin-bottom: 2px; display: block; }
        .sun { color: var(--toss-red); } .sat { color: var(--toss-blue); }
        .task-node { background: #e8f3ff; color: var(--toss-blue); font-size: 10px; padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; cursor: grab; border: none; width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
        
        /* 하단 리스트 및 필터 섹션 */
        .list-section { flex: 1; border-top: 2px solid var(--toss-blue); background: #f9fafb; padding: 15px 20px; overflow-y: auto; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .list-header h3 { margin: 0; font-size: 16px; }
        
        /* 필터 버튼 스타일 */
        .filter-group { display: flex; gap: 5px; }
        .filter-btn { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid #e5e8eb; background: white; color: #8b95a1; cursor: pointer; transition: 0.2s; }
        .filter-btn.active.all { background: #eee; color: #333; border-color: #ccc; }
        .filter-btn.active.todo { background: var(--toss-red); color: white; border-color: var(--toss-red); }
        .filter-btn.active.ing { background: var(--toss-yellow); color: white; border-color: var(--toss-yellow); }
        .filter-btn.active.done { background: var(--toss-green); color: white; border-color: var(--toss-green); }

        .task-card { background: white; border-radius: 10px; padding: 10px 15px; margin-bottom: 6px; border: 1px solid #e5e8eb; cursor: pointer; transition: 0.1s; }
        .task-card:hover { border-color: var(--toss-blue); }
        .status-btn { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; color: white; border: none; white-space: nowrap; }
        .bg-red { background: var(--toss-red); } .bg-yellow { background: var(--toss-yellow); } .bg-green { background: var(--toss-green); }
        
        /* 모달 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 20px; width: 480px; max-height: 85vh; overflow-y: auto; }
        .todo-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 10px; border: 1px solid #eee; cursor: grab; }
        .todo-item.dragging { opacity: 0.4; background: #e8f3ff; }
        input, select { padding: 8px; border: 1px solid #e5e8eb; border-radius: 8px; font-size: 13px; }
        .history-box { margin: 8px 0; background: #f8f9fa; border-radius: 8px; padding: 8px; border: 1px dashed #ced4da; }
        .history-title { font-size: 11px; font-weight: bold; color: #8b95a1; margin-bottom: 4px; }
        .history-item { font-size: 11px; color: #4e5968; display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="nav-group">
            <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <div id="monthDisplay" class="current-month" onclick="toggleJumpBox(event)"></div>
            <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            <div id="jumpBox" class="jump-box">
                <div class="jump-grid" id="yearGrid"></div>
                <div class="jump-grid" id="monthGrid"></div>
            </div>
        </div>
        <button class="btn-main" onclick="showModal()">+ 업무 등록</button>
    </div>
    
    <div class="calendar-section">
        <div class="day-labels"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div id="calendarBoard" class="calendar-grid"></div>
    </div>
    
    <div class="list-section">
        <div class="list-header">
            <h3>📊 업무 진행 현황</h3>
            <div class="filter-group">
                <button onclick="setFilter('전체')" id="filter-all" class="filter-btn all active">전체</button>
                <button onclick="setFilter('시작 전')" id="filter-todo" class="filter-btn todo">시작 전</button>
                <button onclick="setFilter('진행 중')" id="filter-ing" class="filter-btn ing">진행 중</button>
                <button onclick="setFilter('완료')" id="filter-done" class="filter-btn done">완료</button>
            </div>
        </div>
        <div id="masterTaskList"></div>
    </div>
</div>

<div id="taskModal" class="modal">
    <div class="modal-box">
        <h2 id="modalTitle" style="margin-top:0; font-size:20px;">업무 편집</h2>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <input type="text" id="mTitle" placeholder="업무명">
            <div style="display:flex; flex-direction:column; gap:4px;">
                <div style="display:flex; gap:8px;">
                    <input type="date" id="mDate" style="flex:1">
                    <input type="text" id="mPartner" placeholder="담당자" style="flex:1">
                </div>
                <div id="dateHistoryArea" class="history-box" style="display:none;">
                    <div class="history-title">📅 완료 예정일 변경 이력</div>
                    <div id="historyList"></div>
                </div>
            </div>
            <div style="margin-top:10px; font-weight:bold; font-size:14px; display:flex; justify-content:space-between; align-items:center;">
                To-do (드래그 순서 조정) <button onclick="addTodoRow()" style="color:var(--toss-blue); border:none; background:none; cursor:pointer; font-weight:bold; font-size:13px;">+ 추가</button>
            </div>
            <div id="todoListContainer"></div>
            <button class="btn-main" style="margin-top:15px; padding:12px;" onclick="saveTask()">정보 저장</button>
            <button onclick="closeModal()" style="border:none; background:none; color:#8b95a1; margin-top:5px; cursor:pointer;">닫기</button>
        </div>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('bizTaskFinalV2')) || [];
    let currentFilter = '전체';
    
    const today = new Date();
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();
    
    if(viewYear < 2026) { viewYear = 2026; viewMonth = 0; }
    else if(viewYear > 2030) { viewYear = 2030; viewMonth = 11; }

    let editingId = null;

    function handleTaskDragStart(e, taskId) { e.dataTransfer.setData("taskId", taskId); e.currentTarget.style.opacity = "0.4"; }
    function handleTaskDragEnd(e) { e.currentTarget.style.opacity = "1"; document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('drag-over')); }
    function onCellDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onCellDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    
    function onCellDrop(e, targetDate) {
        e.preventDefault();
        const taskId = e.dataTransfer.getData("taskId");
        const taskIndex = tasks.findIndex(t => t.id == taskId);
        
        if (taskIndex > -1 && tasks[taskIndex].date !== targetDate) {
            const oldDate = tasks[taskIndex].date;
            tasks[taskIndex].date = targetDate;
            
            if (!tasks[taskIndex].dateHistory) tasks[taskIndex].dateHistory = [];
            const now = new Date();
            const timestamp = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
            tasks[taskIndex].dateHistory.push({ from: oldDate, to: targetDate, time: timestamp + " (드래그)" });
            
            localStorage.setItem('bizTaskFinalV2', JSON.stringify(tasks));
            render();
        }
    }

    function toggleJumpBox(e) { e.stopPropagation(); const box = document.getElementById('jumpBox'); box.style.display = box.style.display === 'block' ? 'none' : 'block'; if(box.style.display === 'block') renderJumpGrids(); }
    function renderJumpGrids() {
        const yGrid = document.getElementById('yearGrid'); const mGrid = document.getElementById('monthGrid');
        yGrid.innerHTML = ''; mGrid.innerHTML = '';
        for(let y=2026; y<=2030; y++) {
            const div = document.createElement('div'); div.className = `jump-item ${y === viewYear ? 'active' : ''}`; div.innerText = y;
            div.onclick = () => { viewYear = y; renderJumpGrids(); render(); }; yGrid.appendChild(div);
        }
        for(let m=0; m<12; m++) {
            const div = document.createElement('div'); div.className = `jump-item ${m === viewMonth ? 'active' : ''}`; div.innerText = (m+1) + '월';
            div.onclick = () => { viewMonth = m; document.getElementById('jumpBox').style.display = 'none'; render(); }; mGrid.appendChild(div);
        }
    }
    window.onclick = () => { document.getElementById('jumpBox').style.display = 'none'; };
    function changeMonth(d) { viewMonth += d; if(viewMonth < 0) { viewMonth = 11; viewYear--; } else if(viewMonth > 11) { viewMonth = 0; viewYear++; } render(); }

    /* 필터 설정 함수 */
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if(filter === '전체') document.getElementById('filter-all').classList.add('active');
        if(filter === '시작 전') document.getElementById('filter-todo').classList.add('active');
        if(filter === '진행 중') document.getElementById('filter-ing').classList.add('active');
        if(filter === '완료') document.getElementById('filter-done').classList.add('active');
        renderList();
    }

    /* 업무 상태 계산 로직 (기존 로직 유지) */
    function calculateStatus(task) {
        let status = { label: '시작 전', class: 'bg-red' };
        if(task.todos && task.todos.length > 0) {
            if(task.todos[0].status === '시작전') status = { label: '시작 전', class: 'bg-red' };
            else if(task.todos[task.todos.length-1].status === '완료') status = { label: '완료', class: 'bg-green' };
            else status = { label: '진행 중', class: 'bg-yellow' };
        }
        return status;
    }

    function render() {
        document.getElementById('monthDisplay').innerText = `${viewYear}년 ${viewMonth + 1}월`;
        const board = document.getElementById('calendarBoard'); board.innerHTML = '';
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

        for(let i=0; i<firstDay; i++) board.innerHTML += '<div class="cell" style="background:#f9fafb"></div>';
        
        for(let d=1; d<=lastDate; d++) {
            const dStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayTasks = tasks.filter(t => t.date === dStr);
            const dayIdx = new Date(viewYear, viewMonth, d).getDay();
            
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.ondragover = (e) => onCellDragOver(e);
            cell.ondragleave = (e) => onCellDragLeave(e);
            cell.ondrop = (e) => onCellDrop(e, dStr);
            
            cell.innerHTML = `<span class="date-num ${dayIdx===0?'sun':(dayIdx===6?'sat':'')}">${d}</span>`;
            
            dayTasks.forEach(t => {
                const node = document.createElement('button');
                node.className = 'task-node';
                node.draggable = true;
                node.innerText = t.title;
                node.onclick = () => showModal(t.id);
                node.ondragstart = (e) => handleTaskDragStart(e, t.id);
                node.ondragend = (e) => handleTaskDragEnd(e);
                cell.appendChild(node);
            });
            board.appendChild(cell);
        }
        renderList();
    }

    function renderList() {
        const list = document.getElementById('masterTaskList'); 
        list.innerHTML = '';
        
        // 1. 전체 업무 데이터에서 상태를 먼저 계산하고 필터링 적용
        const filteredTasks = tasks.filter(t => {
            if (currentFilter === '전체') return true;
            const status = calculateStatus(t);
            return status.label === currentFilter;
        });

        filteredTasks.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t => {
            const status = calculateStatus(t);
            const div = document.createElement('div'); div.className = 'task-card'; div.onclick = () => showModal(t.id);
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="status-btn ${status.class}">${status.label}</button>
                        <span style="font-weight:bold; font-size:15px; color:#191f28;">${t.title}</span>
                    </div>
                    <span style="color:#8b95a1; font-size:12px;">📅 ${t.date.slice(5)} | 👤 ${t.partner || '미지정'}</span>
                </div>
            `;
            list.appendChild(div);
        });
        
        if(filteredTasks.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#adb5bd; font-size:13px; margin-top:20px;">해당 단계의 업무가 없습니다.</p>`;
        }
    }

    function initDragEvents() {
        const container = document.getElementById('todoListContainer');
        container.addEventListener('dragover', e => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) container.appendChild(dragging);
            else container.insertBefore(dragging, afterElement);
        });
    }

    function getDragAfterElement(container, y) {
        const elements = [...container.querySelectorAll('.todo-item:not(.dragging)')];
        return elements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function showModal(id = null) {
        editingId = id; document.getElementById('taskModal').style.display = 'flex';
        const container = document.getElementById('todoListContainer'); container.innerHTML = '';
        const historyArea = document.getElementById('dateHistoryArea');
        const historyList = document.getElementById('historyList');
        if(id) {
            const t = tasks.find(x => x.id === id);
            document.getElementById('mTitle').value = t.title; document.getElementById('mDate').value = t.date; document.getElementById('mPartner').value = t.partner;
            if(t.todos) t.todos.forEach(todo => addTodoRow(todo.text, todo.status));
            if(t.dateHistory && t.dateHistory.length > 0) {
                historyArea.style.display = 'block';
                historyList.innerHTML = t.dateHistory.map(h => `<div class="history-item"><span>${h.time}</span><span>${h.from} → <b>${h.to}</b></span></div>`).join('');
            } else historyArea.style.display = 'none';
        } else {
            document.getElementById('mTitle').value = ''; document.getElementById('mDate').value = ''; document.getElementById('mPartner').value = '';
            historyArea.style.display = 'none'; addTodoRow();
        }
    }

    function saveTask() {
        const title = document.getElementById('mTitle').value;
        const date = document.getElementById('mDate').value;
        const todoNodes = document.querySelectorAll('.todo-item');
        const todos = [...todoNodes].map(n => ({ text: n.querySelector('.t-text').value, status: n.querySelector('.t-status').value }));
        if(!title || !date) return alert('입력 확인');
        let currentTask = tasks.find(t => t.id === editingId);
        let dateHistory = currentTask ? (currentTask.dateHistory || []) : [];
        if (currentTask && currentTask.date !== date) {
            const now = new Date();
            dateHistory.push({ from: currentTask.date, to: date, time: `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} (수정)` });
        }
        const newTask = { id: editingId || Date.now(), title, date, partner: document.getElementById('mPartner').value, todos, dateHistory };
        if(editingId) tasks = tasks.map(t => t.id === editingId ? newTask : t);
        else tasks.push(newTask);
        localStorage.setItem('bizTaskFinalV2', JSON.stringify(tasks));
        closeModal(); render();
    }

    function addTodoRow(text = '', status = '시작전') {
        const div = document.createElement('div');
        div.className = 'todo-item';
        div.draggable = true;
        div.innerHTML = `<span style="color:#adb5bd; cursor:grab;">☰</span><input type="text" class="t-text" value="${text}" placeholder="할 일" style="flex:1"><select class="t-status">${['시작전','검토','보고','완료','보완'].map(s => `<option ${s===status?'selected':''}>${s}</option>`).join('')}</select><button onclick="this.parentElement.remove()" style="border:none; background:#ff4d4f; color:white; border-radius:6px; cursor:pointer;">-</button>`;
        div.addEventListener('dragstart', () => div.classList.add('dragging'));
        div.addEventListener('dragend', () => div.classList.remove('dragging'));
        document.getElementById('todoListContainer').appendChild(div);
    }

    function closeModal() { document.getElementById('taskModal').style.display = 'none'; }
    
    initDragEvents();
    render();
</script>
</body>
</html>
