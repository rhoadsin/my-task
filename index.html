<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026-2030 Task Calendar</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #f2f4f6; }
        .app-container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* 헤더 스타일 보완 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 25px; border-bottom: 1px solid #f2f4f6; }
        .nav-group { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: #f2f4f6; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; color: #4e5968; transition: 0.2s; }
        .nav-btn:hover:not(:disabled) { background: #e5e8eb; color: #191f28; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .current-month { font-size: 24px; font-weight: bold; color: #191f28; min-width: 160px; text-align: center; }
        
        .btn-add { background: #3182f6; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* 캘린더 레이아웃 */
        .calendar-wrapper { display: block; width: 100%; border-top: 1px solid #eee; }
        .day-labels { display: flex; background: #fafafa; border-bottom: 1px solid #eee; }
        .day-labels div { flex: 1; padding: 12px 0; text-align: center; font-weight: bold; font-size: 14px; color: #8b95a1; }
        
        .calendar-grid { display: flex; flex-wrap: wrap; width: 100%; }
        .cell { width: calc(100% / 7); min-height: 120px; box-sizing: border-box; border-right: 1px solid #eee; border-bottom: 1px solid #eee; padding: 10px; background: white; }
        .cell:nth-child(7n) { border-right: none; }
        
        .date-num { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: block; }
        .cell:nth-child(7n+1) .date-num { color: #f04452; } /* 일요일 */
        .cell:nth-child(7n) .date-num { color: #3182f6; }   /* 토요일 */
        .other-month { background-color: #f9fafb; color: #ccc; }

        .task-badge { background: #e8f3ff; color: #3182f6; font-size: 11px; padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #3182f6; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #e5e8eb; border-radius: 12px; box-sizing: border-box; font-size: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="nav-group">
            <button id="prevBtn" class="nav-btn" onclick="changeMonth(-1)">◀</button>
            <div id="monthDisplay" class="current-month">2026년 2월</div>
            <button id="nextBtn" class="nav-btn" onclick="changeMonth(1)">▶</button>
        </div>
        <button class="btn-add" onclick="openModal()">+ 일정 추가</button>
    </div>

    <div class="calendar-wrapper">
        <div class="day-labels">
            <div style="color: #f04452;">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color: #3182f6;">토</div>
        </div>
        <div id="calendarBoard" class="calendar-grid"></div>
    </div>
</div>

<div id="modal">
    <div class="modal-box">
        <h2 style="margin-top:0">새 일정 추가</h2>
        <input type="text" id="taskTitle" placeholder="업무 이름을 입력하세요">
        <input type="date" id="taskDate">
        <input type="text" id="taskPartner" placeholder="협업 담당자">
        <button class="btn-add" style="width:100%; padding: 16px;" onclick="saveTask()">저장하기</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#8b95a1; margin-top:12px; cursor:pointer;">닫기</button>
    </div>
</div>

<script>
    // 상태 관리 변수
    let tasks = JSON.parse(localStorage.getItem('myFinalGcalV5')) || [];
    let viewYear = 2026;
    let viewMonth = 1; // 0=1월, 1=2월...

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) {
            viewMonth = 11;
            viewYear--;
        } else if (viewMonth > 11) {
            viewMonth = 0;
            viewYear++;
        }
        render();
    }

    function saveTask() {
        const title = document.getElementById('taskTitle').value;
        const date = document.getElementById('taskDate').value;
        if(!title || !date) return alert('제목과 날짜를 입력해주세요.');
        
        tasks.push({ id: Date.now(), title, date, partner: document.getElementById('taskPartner').value });
        localStorage.setItem('myFinalGcalV5', JSON.stringify(tasks));
        closeModal();
        render();
    }

    function render() {
        // 1. 헤더 업데이트 및 버튼 제어
        document.getElementById('monthDisplay').innerText = `${viewYear}년 ${viewMonth + 1}월`;
        
        // 2026년 1월 이전 차단
        document.getElementById('prevBtn').disabled = (viewYear === 2026 && viewMonth === 0);
        // 2030년 12월 이후 차단
        document.getElementById('nextBtn').disabled = (viewYear === 2030 && viewMonth === 11);

        const board = document.getElementById('calendarBoard');
        board.innerHTML = '';

        // 해당 월의 1일 요일 및 마지막 날짜 계산
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

        // 공백 칸 생성
        for(let i=0; i < firstDay; i++) {
            board.innerHTML += '<div class="cell other-month"></div>';
        }

        // 날짜 생성
        for(let d=1; d <= lastDate; d++) {
            const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayTasks = tasks.filter(t => t.date === dateStr);
            const taskHtml = dayTasks.map(t => `<div class="task-badge">${t.title}</div>`).join('');

            board.innerHTML += `
                <div class="cell">
                    <span class="date-num">${d}</span>
                    <div class="task-list">${taskHtml}</div>
                </div>
            `;
        }
    }

    render();
</script>
</body>
</html>
